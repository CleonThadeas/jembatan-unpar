name: Deploy static prototype
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Exposed as a step output (not $GITHUB_ENV) so unit tests run with the default empty base path.
      # Set the repository variable PAGES_CUSTOM_DOMAIN when the site is served from its own (sub)domain root.
      - name: Configure project path
        id: path
        shell: bash
        env:
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          if [ -n "$CUSTOM_DOMAIN" ] || [ "${REPO,,}" = "$OWNER.github.io" ]; then
            printf 'base_path=\n' >> "$GITHUB_OUTPUT"
          else
            printf 'base_path=/%s\n' "$REPO" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.path.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
